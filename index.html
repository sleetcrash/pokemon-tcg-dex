<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://images.pokemontcg.io" crossorigin>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Card Dex">
<meta name="theme-color" content="#b02a2d">
<style>
  :root{
    --col:640px; --gutter:10px;
    --page:oklch(0.955 0.006 95); --card:oklch(0.98 0.004 95); --card-hi:oklch(0.9 0.008 95);
    --well:oklch(0.885 0.008 95); --art:oklch(0.74 0.01 95);
    --ink:oklch(0.22 0.012 95); --ink-dim:oklch(0.47 0.012 95);
    --line:oklch(0.6 0.01 95); --line-hi:oklch(0.24 0.012 95);
    --accent:oklch(0.55 0.19 25);
    --shell:oklch(0.5 0.17 25); --shell-deep:oklch(0.4 0.14 25); --shell-dim:oklch(0.9 0.05 25);
    --pend:oklch(0.55 0.12 85); --pend-deep:oklch(0.42 0.1 85); --pend-lite:oklch(0.82 0.13 88);
    --poly:oklch(0.23 0.006 260); --poly-hi:oklch(0.36 0.008 260);
    --ok:oklch(0.5 0.13 150); --glow:oklch(0.62 0.22 28); --shadow:0 8px 24px oklch(0.25 0.02 95 / .16);
    --icon-search:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.7%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect x=%223%22 y=%222.5%22 width=%2214%22 height=%2219%22/%3E%3Ccircle cx=%2214.5%22 cy=%2215%22 r=%224.2%22/%3E%3Cline x1=%2217.6%22 y1=%2218.1%22 x2=%2221%22 y2=%2221.5%22/%3E%3C/svg%3E");
    --ball:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeBAMAAADJHrORAAAAA3NCSVQFBQUYJt5DAAAAIVBMVEX///8xMTH/lDqcSjr/1jr////eWjpKUlKlpcV7e4TezvdcMgHRAAAAAXRSTlMAQObYZgAAAH5JREFUGNNjYKALEBQUROEqKSkhCTACuUpqAnC+kAtIIBEurRLqBOSnCeDgCymB1aclwvlg83DyhcH8tDRDKF/cSL0cyE0uhPHLKyLK0szLYXzG6aWh5eXllXD7l86IAHJXwB0sFTlz1apVjQj/dAG5HQJI/u3o6BDEEx60AwCJgyJdBXcpkgAAAABJRU5ErkJggg==);
    --hball:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAADXklEQVRYw+2WTWyTdRzHm43QrRvpCntxWzTqQROjJpDpXlu2vq1P15d1LXAwEi/YzXUoZaPdnm5zslVwToUwHCgXISQcPAw5kEwSEBOoGVJ6AJxuevC2CxdPmnz89WlCIjEatrJTv8k3z5MneZ7vy+/5P/9HpyuggALWDozVRmqfrqB4s46NlRbBpQd/0RXqpivgZOFuBl3JBpgoL9ZRXF9Dar+D07EBvv7lD8YuX2d2IsaXe9vYVP8UL5Q9OSNcv3IJpvyQDDHjbWJOHeTTSZVznlfgsxAc62H40CD1+vybgFQA5pvgkgUWFDiyW9iT4/Qe+HCXGBPOBPj1gJW6fI1ki9T+fTb5fCMP8Y1ZmhCxI48wa+LjIJlwC+NqjBfL82Gipho+6s6J/p8BGQ2fhFjsNbPS306RvBPrEzca4KTUm5T6F1y5+rURyPnkv6SXsaTCraT7LSyGrfz+noOirWXrMLFti8x0T05g6hH+I/muXEvZ9PvaSPfuJN1nYSnSTlldJWtdc3z74x1J5hNBaeCovHSTcn40KKLC6Wzq0MPkWfHU25K+16KJ35bjSl8z0fEEJaaSxzexrc7E1UyGl1/fwU/zZ/gz8hrJKzcZGIwSHRnhJcUDs2FpKKjVfmufWRNe7LNyt6+d5SE3rb4A7yfiVD1T/fgGsq7D8UOsXjxFc8sOjl37ge/On8Rm3Y7D0cDxgTd4tcvHSqSV+xEL90T83jtmlvs7aHPasPm7Sb7VjT/ox1BpWNsYisqK+GBsHK/HTjx2EGvHdi6m7wjTOOwNjI6qON0WXIqFTu9OjU63mXgiwWF1mJ4eD3qTfn0rYWtNKX6vi2F5oNfTQnwwrtHraWVErnmUFk1wRI2TGEvg81hw2pvw+1xU1Zav/ztgMumYmDhIcv+b+PxuzURW3C9Cw6qK3WbGbjfjVjpQXO0oTY08SJ9CVQ+QvTcvX8NS2WDmp+N0dlolpcqoJFWUNizmBpZvnODn1OecjQb5Srh6a44zUxFK870plRh0TB6O4e9sxmZr5MLQbu6LeObacU6Hu1i5eoLVG3NEhwYoNTyhHbHCKD8hzz/H5Ym9LEvSpZuznH83wG+3v+DcTAR9xeb81f5fKJYlaqqv0lj5bK123GTUb/BfUQEFFJAn/A3xe2oF2MNqqgAAAABJRU5ErkJggg==);
    --kanto:oklch(0.5 0.158 23); --johto:oklch(0.48 0.126 87); --hoenn:oklch(0.47 0.131 152); --sinnoh:oklch(0.48 0.108 259); --unova:oklch(0.48 0.015 262);
    --kalos:oklch(0.5 0.145 347); --alola:oklch(0.46 0.095 189); --galar:oklch(0.49 0.11 289); --hisui:oklch(0.48 0.071 69); --paldea:oklch(0.5 0.129 332); --pogo:oklch(0.48 0.127 246);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  input,textarea,button,select{border-radius:0;-webkit-appearance:none;appearance:none}
  html{scroll-behavior:smooth}
  body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:40;background:oklch(0.955 0.006 95 / .94);backdrop-filter:blur(8px);border-bottom:3px solid var(--ink);padding:0 0 3px;transition:transform .22s ease}
  header.away{transform:translateY(-100%)}
  @media (prefers-reduced-motion:reduce){header{transition:none}}
  .hwrap{max-width:var(--col);margin:0 auto;padding:0 var(--gutter)}
  .band{background:var(--shell);color:var(--card);padding:8px 0 6px;margin-bottom:6px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .count{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--shell-dim)}
  .count b{color:var(--card);font-weight:600}
  #pend{color:var(--pend-lite);font-weight:600}
  .pct{color:var(--shell-dim)}
  .bar{height:3px;background:var(--shell-deep);margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--card);transition:width .3s ease}

  .search{position:relative}
  .search input{width:100%;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row:focus-visible,.card:focus-visible{outline-offset:-2px}
  .row,.card{scroll-margin-top:calc(var(--hdr,150px) + 6px)}
  .row.hold .slot,.card.hold .pball{animation:holdring .45s linear forwards}
  @keyframes holdring{from{box-shadow:0 0 0 0 oklch(0.55 0.19 25 / 0)}to{box-shadow:0 0 0 4px oklch(0.55 0.19 25 / .6)}}
  .sugg button.hi{background:var(--card)}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card-hi);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:none;max-height:260px;overflow-y:auto;z-index:40}
  .sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
  .sugg button:last-child{border-bottom:0}
  .sugg button:active{background:var(--card)}
  .sugg .no{font-family:ui-monospace,Menlo,monospace;color:var(--ink-dim);font-size:12px}

  .filters{display:flex;gap:5px;margin-top:6px}
  .dd{position:relative;flex:1;min-width:0}
  .ddbtn{width:100%;padding:0 8px;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);font-size:12px;font-weight:650;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent}
  .dd.has .ddbtn{border-color:var(--accent)}
  .ddpanel{position:absolute;left:0;top:calc(100% + 4px);min-width:184px;background:var(--card-hi);border:1px solid var(--line);box-shadow:var(--shadow);z-index:45;display:none;max-height:min(72vh,460px);overflow-y:auto;padding:4px 0}
  .dd:last-child .ddpanel{left:auto;right:0}
  .dd.open .ddpanel{display:block}
  .ddpanel label{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ddpanel input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid var(--line-hi);background:var(--card);flex:none;display:grid;place-items:center;margin:0}
  .ddpanel input:checked{background:var(--ink);border-color:var(--ink)}
  .ddpanel input:checked::after{content:"";width:7px;height:4px;border-left:2px solid var(--page);border-bottom:2px solid var(--page);transform:rotate(-45deg) translateY(-1px)}
  .ddpanel input[type=radio]{border-radius:50%}
  .ddpanel input[type=radio]:checked::after{width:6px;height:6px;border:0;border-radius:50%;background:var(--page);transform:none}

  main{padding:6px var(--gutter) 60px;max-width:var(--col);margin:0 auto}
  @media(max-width:720px){main{padding-right:calc(var(--gutter) + 40px)}}
  @media(hover:hover){.row:hover{border-color:var(--line-hi)}.card:hover{border-color:var(--line-hi)}}
  .ddbtn:disabled{opacity:.4;cursor:default}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .row .spr img{opacity:.6;filter:grayscale(1);transition:opacity .2s,filter .2s}
  .row.done .spr img{opacity:1;filter:none}
  .row.pend .spr img{opacity:.85;filter:none}
  .row.done.ft-Dynamax .spr img,.row.pend.ft-Dynamax .spr img,.card.own.ft-Dynamax img,.card.pend.ft-Dynamax img{filter:drop-shadow(0 0 5px var(--glow))}
  .row.done.ft-Tera .spr img,.row.pend.ft-Tera .spr img,.card.own.ft-Tera img,.card.pend.ft-Tera img{filter:drop-shadow(0 0 5px rgba(120,220,255,.95)) saturate(1.3) brightness(1.1)}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink);opacity:0;transition:opacity .25s}
  .row.done{background:var(--card-hi);border-color:var(--line-hi)}
  .row.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,60%{border-color:var(--accent);box-shadow:0 0 0 2px oklch(0.55 0.19 25 / .3)}100%{border-color:var(--line);box-shadow:none}}
  .row:active,.card:active{background:var(--card-hi)}

  .lz{width:44px;flex:none;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-dim)}
  .exp{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;border:1px solid var(--line-hi);padding:2px 0;width:40px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:2px}
  .exp .car{display:inline-block;font-size:13px;line-height:1;transition:transform .15s}
  .exp[hidden]{display:none}
  .exp.on .car{transform:rotate(90deg)}
  .exp.r{color:var(--accent);border-color:var(--accent)}
  .exp.y{color:var(--pend);border-color:var(--pend)}
  .exp.g{background:var(--ok);color:var(--page);border-color:var(--ok)}
  .colmode .row.frm{margin-left:18px}
  .spr{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--art)}
  .spr img{width:44px;height:44px;image-rendering:pixelated}
  .spr img.sm,.card .part img.sm,.card .lbl img.sm{image-rendering:auto}
  .spr .fb{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--ink-dim)}
  .who{flex:1;min-width:0}
  .name{font-size:14px;font-weight:650;line-height:1.2}
  .row.done .name{color:var(--ink)}
  .chip.r{font-weight:700;color:var(--rc)}
  .chip.r.Kanto{--rc:var(--kanto)}
  .chip.r.Johto{--rc:var(--johto)}
  .chip.r.Hoenn{--rc:var(--hoenn)}
  .chip.r.Sinnoh{--rc:var(--sinnoh)}
  .chip.r.Unova{--rc:var(--unova)}
  .chip.r.Kalos{--rc:var(--kalos)}
  .chip.r.Alola{--rc:var(--alola)}
  .chip.r.Galar{--rc:var(--galar)}
  .chip.r.Hisui{--rc:var(--hisui)}
  .chip.r.Paldea{--rc:var(--paldea)}
  .chip.r.POGO{--rc:var(--pogo)}
  .chips{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
  .chip{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1.5px 6px;background:var(--well);color:var(--ink-dim)}
  .chip.f{color:var(--ink);font-weight:700}

  .rp{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-right:8px}
  .rp a{color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted var(--line-hi);padding:4px 0}
  .rp a:hover{color:var(--ink)}
  .slot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-hi);position:relative;transition:transform .2s}
  .row.done .slot,.row.pend .slot{border-color:transparent}
  .row.done .slot::after,.row.pend .slot::after{content:"";position:absolute;inset:-33.4%;background:var(--ball) center/contain no-repeat;image-rendering:pixelated}
  .row.hs.done .slot::after,.row.hs.pend .slot::after{background-image:var(--hball);inset:-30%}
  .row.pend .slot{transform:rotate(22deg)}
  .row.pend .slot::before,.card.pend .pball::before{content:"";position:absolute;inset:-33.4%;background:var(--ball) center/contain no-repeat;filter:drop-shadow(0 0 2px var(--glow)) drop-shadow(0 0 5px var(--glow));animation:catchpulse 1.1s ease-in-out infinite}
  .row.hs.pend .slot::before,.card.hs.pend .pball::before{background-image:var(--hball);inset:-30%}
  .row.pend::before{opacity:1;background:linear-gradient(180deg,var(--pend-lite),var(--pend-deep) 50%,var(--pend-lite))}
  .star{position:fixed;width:10px;height:10px;pointer-events:none;z-index:60;background:var(--pend-lite);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:starfly .6s ease-out forwards;opacity:0}
  .star.w{background:#f4f2ec;width:7px;height:7px}
  @keyframes starfly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0) rotate(120deg);opacity:0}}
  @keyframes catchpulse{0%,100%{opacity:.35}50%{opacity:.95}}


  .views{display:flex;gap:2px;align-items:center}
  .views>button,.views .ddbtn{flex:none;width:auto;padding:4px 10px;min-height:0;border:0;background:none;color:var(--ink-dim);display:flex;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .views>button:first-child{padding-left:0}
  .views .dd{flex:none;margin-left:auto}
  .views .ddbtn{padding-right:0}
  .views>button.on,.views .dd.has .ddbtn,.views .dd.open .ddbtn{color:var(--ink)}
  .views svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .gpick{position:relative;margin-left:auto}
  .gpick:not([hidden])~.dd{margin-left:0}
  .gpick>button{padding:4px 8px;border:0;background:none;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;-webkit-tap-highlight-color:transparent}
  .gpick .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--page);border:1px solid var(--line);padding:10px;box-shadow:var(--shadow)}
  .gpick .pop[hidden]{display:none}
  .gpick .pop>div:first-child{display:grid;gap:4px}
  #gpGrid{grid-template-columns:repeat(6,22px);grid-auto-rows:22px}
  #ppGrid{grid-template-columns:repeat(6,22px);grid-auto-rows:30px}
  .gpick .pop button{border:1px solid var(--line);background:var(--card);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .gpick .pop button.hi{background:var(--ink);border-color:var(--ink)}
  .gpick .lbl{margin-top:8px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink)}

  #binder,#pocket{--cols:3;padding:10px calc(var(--gutter) + 40px) 60px var(--gutter);max-width:min(100%,max(var(--col),calc(var(--cols) * 132px)));margin:0 auto}
  .pgrid,.bgrid{display:grid;grid-template-columns:repeat(3,1fr);--gap:8px;gap:var(--gap);container-type:inline-size;--r:calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols) * .04)}
  #pgrid .card{content-visibility:auto;contain-intrinsic-size:auto 100px auto var(--tileh,160px)}
  .bgrid{background:var(--well);border:1px solid var(--line);padding:10px}
  /* one slot format: a full-width 63/88 face with card-radius bottom corners and its own hairline, then one bezel strip under it (search, tags, ball).
     Every part is sized in slot units with a legibility floor and no ceiling, so a tile is the same drawing at any column count */
  /* status: missing is grayed out (gray ground, grayscale sprite or scan), registered is full colour on its energy ground,
     pending covers the face with the black poly bubble mailer the card ships in (bubbles through the film, flap with its peel liner), static:
     a sprite entry gets a paper label with the sprite, a chosen card shows through a plastic window cut in the mailer */
  .card,.blankc{--bz:max(18px,11cqw)}
  .card{container-type:inline-size;border-radius:var(--r) var(--r) 0 0;background:var(--card);border:1px solid var(--line);transition:border-color .3s;position:relative;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .card.own,.row.done{--art:var(--e,oklch(0.3 0.012 95));border-color:var(--line-hi)}
  /* a registered sprite sits on the TCG energy colour of its first type (scripts/build-types.py) */
  .e-G{--e:oklch(0.86 0.08 140)}.e-R{--e:oklch(0.84 0.09 32)}.e-W{--e:oklch(0.84 0.07 245)}.e-L{--e:oklch(0.92 0.09 95)}.e-P{--e:oklch(0.85 0.08 315)}
  .e-F{--e:oklch(0.84 0.07 50)}.e-D{--e:oklch(0.72 0.03 260)}.e-M{--e:oklch(0.86 0.015 250)}.e-N{--e:oklch(0.86 0.07 80)}.e-C{--e:oklch(0.97 0.004 95)}
  .card.own{background:var(--card-hi)}
  .row.pend{--art:var(--pend-lite)}
  .card.pend{border-color:var(--pend)}
  .card .fbc{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--ink-dim)}
  .card.flash{animation:flash 1.6s ease}
  .card .face{flex:none;width:100%;aspect-ratio:63/88;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--art);border-radius:0 0 4cqw 4cqw;box-shadow:0 0 0 1px var(--line);transition:background-color .3s}
  .blankc{container-type:inline-size;border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column;border:1px dashed var(--line);background:var(--well);opacity:.5}
  .blankc::before{content:"";aspect-ratio:63/88}
  .blankc::after{content:"";height:var(--bz)}
  .card.pk .ph{flex:none;height:var(--bz);display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:0 3cqw;background:var(--card);border-bottom:1px solid var(--line)}
  .card.pk .pname{font-size:max(8px,min(7.5cqw,calc(140cqw / var(--nl,9))));font-weight:700;color:var(--ink-dim);line-height:1.1;min-width:0}
  .card.pk.own .pname{color:var(--ink)}
  .card .pno{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:max(9px,6cqw);color:var(--ink-dim)}
  .card.pk .part{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card.pk .part img{width:64%;max-height:92%;object-fit:contain;image-rendering:pixelated;opacity:.6;filter:grayscale(1);transition:opacity .2s,filter .2s}
  .card.pk.own .part img{opacity:1;filter:none}
  .card.scan .face{background:none}
  .card .cardart{width:100%;height:100%;object-fit:cover;display:block;opacity:.55;filter:grayscale(1);transition:opacity .2s,filter .2s}
  .card.own .cardart,.card.pend .cardart{opacity:1;filter:none}

    const on=boxes.filter(b=>b.checked);

    dd.classList.toggle("has",on.length>0);

const GENCUT=[151,251,386,493,649,721,809,905,1025];

function predFactory(){
  const fs=formShown(),gs=ddGen.selected(),rs=ddRegion.selected(),ss=ddStatus.selected();
  const wantR=ss.has("Registered"),wantP=ss.has("Pending"),wantM=ss.has("Missing");
  return e=>{

    if(ss.size){
      const st=owned[e[1]];
      if(!((wantR&&st===true)||(wantP&&st==="p")||(wantM&&!st)))return false;
    }

  };

// one binder tile. Every slot is a full-width 63/88 face (drawn sprite card, or
// the chosen scan filling it exactly) over one bezel strip: search button left,
// tags centre, status ball right. The scan carries a remove button that shows
// on hover or after a first tap, and its price as a tag over the bottom-right corner.
function binderTile([n,id,name,region,gen,form,sref],map){
  const sid=sref||id;
  const c=document.createElement("div");
  map.set(id,c);
  const art=cardArt(id);
  const chips=`${form?`<span class="chip f">${form==="Other"?"Form":form}</span>`:""}<span class="chip">Gen ${gen}</span><span class="chip r ${region}">${region}</span>`;
  const foot=`<div class="pfoot"><button class="setc" type="button" tabindex="-1" aria-label="Cards" title="Find cards"></button><span class="ptag">${chips}</span><span class="pball"></span></div>`;
  c.className="card e-"+energyOf.get(id)+(art?" scan":" pk")+(owned[id]===true?" own":owned[id]==="p"?" pend":"")+(region==="Hisui"?" hs":"")+(form?" ft-"+form:"");
  c.dataset.id=id;c.tabIndex=-1;
  if(art){
    c.innerHTML=`<div class="face"><img class="cardart" loading="lazy" src="${cimg(art,"low")}" alt="${name}"><button class="rmx" type="button" tabindex="-1" aria-label="Remove card" title="Remove card">&#215;</button><span class="pprice"></span></div>`+foot;
    priceInfo(id).then(p=>{
      if(!p||!c.isConnected)return;
      c.querySelector(".pprice").replaceChildren(priceLink(p));
    });
  }else{
    const dn=name.replace(/^Gigantamax /,"G-Max ");
    c.innerHTML=`<div class="face"><div class="ph"><span class="pname" style="--nl:${dn.length}">${dn}</span><span class="pno">#${String(n).padStart(4,"0")}</span></div>`+
      `<div class="part">${sprImg(sid)}</div></div>`+foot;
  }
  syncMailer(c,id);
  c.addEventListener("click",ev=>{
    if(ev.target.closest("a"))return;
    if(ev.target.closest(".setc")){openCards(byId.get(id));return}
    if(ev.target.closest(".rmx")){removeArt(id);return}
    handleTap(id);
  });
  return c;
}

// search: jump to the entry in whichever view is active
const q=$("q"),sugg=$("sugg");
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const NORMS=DEX.map(e=>norm(e[2]));
const LB=[new Array(64),new Array(64)];
function lev(a,b){
  const m=a.length,n=b.length;let prev=LB[0],cur=LB[1];
  for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}[prev,cur]=[cur,prev]}
  return prev[n];
}
// rank: prefix matches, then substring, then close misspellings
let lastQ="",lastHits=[];
function searchHits(raw){
  const t=norm(raw);
  if(t.length<2)return [];
  if(t===lastQ)return lastHits;
  const pre=[],sub=[];
  DEX.forEach((e,i)=>{
    if(String(e[0])===raw.trim()){pre.push(e);return}
    const s=NORMS[i];
    if(s.startsWith(t))pre.push(e);else if(s.includes(t))sub.push(e);
  });
  let hits=pre.concat(sub);
  if(hits.length<3){
    const maxD=Math.max(2,Math.floor(t.length/4));
    const fuzzy=[];
    DEX.forEach((e,i)=>{
      if(hits.includes(e))return;
      const s=NORMS[i];
      const base=s.length>t.length?s.slice(0,t.length):s;
      const d=Math.min(lev(t,s),lev(t,base)+ (s.length>t.length?0.5:0));
      if(d<=maxD)fuzzy.push([d,e]);
    });
    fuzzy.sort((a,b)=>a[0]-b[0]);
    hits=hits.concat(fuzzy.map(f=>f[1]));
  }
  lastQ=t;lastHits=hits.slice(0,8);
  return lastHits;
}

// named lists + sync code: collection state as a bitmap over DEX order
const NEWER={1:["Other","Gmax","Dynamax","Tera"],2:["Other","Gmax","Dynamax","Tera"],3:["Gmax","Dynamax","Tera"],4:["Dynamax","Tera"],6:[]};
const SEQ=Object.fromEntries(Object.entries(NEWER).map(([v,ex])=>[v,DEX.filter(e=>!ex.includes(e[5])&&e[1]<400000)]));
SEQ[6]=DEX;
function encodeOwned(){
  const bytes=new Uint8Array(Math.ceil(DEX.length/4));
  DEX.forEach((e,i)=>{
    const v=owned[e[1]]===true?1:owned[e[1]]==="p"?2:0;
    bytes[i>>2]|=v<<((i&3)*2);
  });
  let s="";bytes.forEach(b=>s+=String.fromCharCode(b));
  return `ILDEX6.${DEX.length}.`+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeOwned(code){
  const m=code.trim().match(/^ILDEX([123456])\.(\d+)\.([A-Za-z0-9_-]+)$/);
  if(m&&!SEQ[m[1]])return null;
  if(!m)return null;
  const v=m[1],seq=SEQ[v];
  if(Number(m[2])!==seq.length)return null;
  let b64=m[3].replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length%4)b64+="=";
  let raw;try{raw=atob(b64)}catch(e){return null}
  const need=v==="1"?Math.ceil(seq.length/8):Math.ceil(seq.length/4);
  if(raw.length!==need)return null;
  const next={};
  seq.forEach((e,i)=>{
    if(v==="1"){if(raw.charCodeAt(i>>3)&(1<<(i&7)))next[e[1]]=true}
    else{const s=(raw.charCodeAt(i>>2)>>((i&3)*2))&3;if(s===1)next[e[1]]=true;else if(s==2)next[e[1]]="p"}
  });
  return next;
}
function applyOwned(next){
  owned=next;store.save("dex-il",owned);
  rowMap.forEach((row,id)=>{
    row.classList.toggle("done",owned[id]===true);
    row.classList.toggle("pend",owned[id]==="p");
  });
  tally();
  if(prefs.view==="binder")renderBinder();else if(prefs.view==="pocket")renderPocket();
  if(ddStatus.selected().size)applyFilters();else refreshDisplay();
}
let LISTS=store.load("dex-il-lists");
const modal=$("modal"),mLists=$("mLists"),mCode=$("mCode"),mMsg=$("mMsg");
function renderLists(){
  mLists.innerHTML="";
  const names=Object.keys(LISTS).sort();
  if(!names.length){mLists.innerHTML='<p class="mhint">No saved lists yet.</p>';return}
  names.forEach(name=>{
    const dec=decodeOwned(LISTS[name]);
    const row=document.createElement("div");
    row.className="lrow";
    row.innerHTML=`<span class="ln">${name}</span><span class="lc">${dec?Object.keys(dec).length:"?"} / ${DEX.length}</span>`;
    const load=document.createElement("button");load.textContent="Load";
    load.addEventListener("click",()=>{
      const next=decodeOwned(LISTS[name]);
      if(next){applyOwned(next);mCode.value=encodeOwned();mMsg.textContent=`Loaded "${name}".`}
    });
    const del=document.createElement("button");del.textContent="Delete";
    del.addEventListener("click",()=>{
      delete LISTS[name];store.save("dex-il-lists",LISTS);renderLists();
    });
    row.append(load,del);
    mLists.appendChild(row);
  });
}
function openModal(){mMsg.textContent="";mCode.value=encodeOwned();renderLists();openDialog(modal)}
modal.addEventListener("close",()=>document.documentElement.classList.remove("lock"));
$("optLists").addEventListener("click",()=>{closeMenus();openModal()});
$("mClose").addEventListener("click",()=>modal.close());
modal.addEventListener("click",e=>{if(e.target===modal)modal.close()});
$("mSave").addEventListener("click",()=>{
  const name=$("mName").value.trim();
  if(!name){mMsg.textContent="Name the list first.";return}
  LISTS[name]=encodeOwned();store.save("dex-il-lists",LISTS);
  $("mName").value="";renderLists();
  mMsg.textContent=`Saved "${name}" (${Object.keys(owned).length} checked).`;
});
$("mCopy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(mCode.value);mMsg.textContent="Copied."}
  catch(e){mCode.focus();mCode.select();mMsg.textContent="Copy blocked here: long-press the code to copy it manually."}
});
$("mApply").addEventListener("click",()=>{
  const next=decodeOwned($("mIn").value);
  if(!next){mMsg.textContent="That code is not valid for this dex.";return}
  applyOwned(next);
  $("mIn").value="";mCode.value=encodeOwned();
  mMsg.textContent=`Applied: ${Object.keys(owned).length} checked.`;
});

// region checkpoints: tap to jump, like an A-Z index. The list scrubs its rows, the pocket
// its tiles; the binder turns to the page that holds the entry and highlights the region
// its page ends in, the way a dictionary page header names the page's last word
const jumps=$("jumps"),toTop=$("toTop"),toEnd=$("toEnd");
const jumpArr=()=>prefs.view==="list"?dispArr:visArr;
const jumpEl=id=>prefs.view==="list"?rowMap.get(id):prefs.view==="pocket"?pTiles.get(id):bTiles.get(id);
const docTop=el=>el.getBoundingClientRect().top+window.scrollY;
function bandOf(e){
  if(prefs.placement==="group"&&e[5])return e[5]==="Regional"?e[3]:e[5]==="Other"?"Forms":e[5];
  if(prefs.placement==="regional"&&e[5]==="Regional")return e[3];
  return speciesRegion(e[0]);
}
const ABBR={Kanto:"KAN",Johto:"JOH",Hoenn:"HOE",Sinnoh:"SIN",Unova:"UNO",Kalos:"KAL",Alola:"ALO",POGO:"GO",Galar:"GAL",Hisui:"HIS",Paldea:"PAL",Forms:"FRM",Mega:"MEG",Gmax:"GMX",Dynamax:"DMX",Tera:"TER"};
function placeJumps(){
  headH=headerEl.offsetHeight;
  jumps.style.top=headH+"px";
  document.documentElement.style.setProperty("--hdr",headH+"px");
}
function renderJumps(){
  const arr=jumpArr();
  if(!arr.length){jumps.hidden=true;updateJumpBtns();return}
  jumps.hidden=false;placeJumps();updateJumpBtns();
  jRuns=[];
  arr.forEach((e,i)=>{
    const b=bandOf(e);
    if(!jRuns.length||jRuns[jRuns.length-1].b!==b)jRuns.push({b,f:!!e[5],start:i,n:1});
    else jRuns[jRuns.length-1].n++;
  });
  jumps.innerHTML="";
  jRuns.forEach((r,i)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="jp"+(r.f?" f":"");
    btn.dataset.idx=i;
    btn.textContent=ABBR[r.b]||r.b.slice(0,3).toUpperCase();
    jumps.appendChild(btn);
  });
  cjLast=-1;cjDirty=true;updateCurrentJump(true);
}
// highlight the checkpoint whose section currently sits at the top of the viewport
let cjRaf=false,cjLast=-1,cjTops=[],cjDirty=true;
function updateCurrentJump(force){
  if(jumps.hidden||!jRuns.length)return;
  let cur=0;
  if(prefs.view==="binder"){
    const last=Math.min(visArr.length,(page+1)*perNow())-1;
    for(let i=0;i<jRuns.length;i++){if(jRuns[i].start<=last)cur=i;else break}
  }else{
    if(cjDirty){const arr=jumpArr();cjTops=jRuns.map(r=>docTop(jumpEl(arr[r.start][1])));cjDirty=false}
    const line=window.scrollY+headH+8;
    for(let i=0;i<cjTops.length;i++){if(cjTops[i]<=line)cur=i;else break}
  }
  if(cur===cjLast&&!force)return;
  const kids=jumps.children;
  if(kids[cjLast])kids[cjLast].classList.remove("cur");
  if(kids[cur])kids[cur].classList.add("cur");
  cjLast=cur;
}
// press jumps into the region; sliding within its checkpoint scrubs that region's Pokemon,
// crossing checkpoints moves between regions
let jRuns=[],jLastId=null,jPend=null,jPendPage=null,jRaf=false;
function btnAtY(y){
  const x=jumps.getBoundingClientRect().left+jumps.offsetWidth/2;
  const el=document.elementFromPoint(x,y);
  return el&&el.closest(".jp");
}
// one frame carries the latest target; a binder page turn queued by the scrub renders here too
function queueScroll(target){
  jPend=target;keepHeader();
  if(jRaf)return;
  jRaf=true;
  requestAnimationFrame(()=>{
    jRaf=false;
    if(jPendPage!==null&&jPendPage!==page){page=jPendPage;renderBinder()}
    jPendPage=null;
    window.scrollTo({top:jPend(),behavior:"instant"});updateCurrentJump();
  });
}
function scrubAt(y,btnHint){
  const btn=btnHint||btnAtY(y);
  if(!btn)return;
  const r=jRuns[Number(btn.dataset.idx)];
  const rect=btn.getBoundingClientRect();
  const frac=rect.height>0?Math.min(1,Math.max(0,(y-rect.top)/rect.height)):0;
  const i=r.start+Math.min(r.n-1,Math.floor(frac*r.n)),e=jumpArr()[i];
  jLastId=e[1];
  if(prefs.view==="binder")jPendPage=Math.floor(i/perNow());
  queueScroll(()=>docTop(jumpEl(e[1]))-headH-6);
}
jumps.addEventListener("touchmove",ev=>ev.preventDefault(),{passive:false});
jumps.addEventListener("pointerdown",ev=>{
  ev.preventDefault();
  try{jumps.setPointerCapture(ev.pointerId)}catch(e){}
  scrubAt(ev.clientY,ev.target.closest(".jp"));
});
jumps.addEventListener("pointermove",ev=>{
  if(ev.buttons)scrubAt(ev.clientY);
});
function jRelease(){
  if(jLastId!==null){
    const el=jumpEl(jLastId);
    if(el){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
    jLastId=null;
  }
}
jumps.addEventListener("pointerup",jRelease);
jumps.addEventListener("pointercancel",jRelease);
let rsRaf=false;
window.addEventListener("resize",()=>{
  if(rsRaf)return;rsRaf=true;
  requestAnimationFrame(()=>{rsRaf=false;placeJumps();cjDirty=true;if(prefs.view==="pocket")layoutPocket();updateJumpBtns()});
});

// the header slides away on a downward scroll and returns on the first upward nudge;
// it stays put near the top of the page, while it holds focus, hover or an open menu,
// and for a moment after any jump that lands an entry beneath it
let lastY=window.scrollY,hdrHold=0;
const hoverMq=matchMedia("(hover:hover)");
function keepHeader(){hdrHold=performance.now()+600;headerEl.classList.remove("away")}
function slideHeader(){
  const y=window.scrollY,dy=y-lastY;lastY=y;
  if(y<=headH||performance.now()<hdrHold||headerEl.matches(":focus-within")||(hoverMq.matches&&headerEl.matches(":hover"))||headerEl.querySelector(".dd.open,.gpick .pop:not([hidden])")){headerEl.classList.remove("away");return}
  if(dy>6)headerEl.classList.add("away");else if(dy<-6)headerEl.classList.remove("away");
}
document.addEventListener("mousemove",ev=>{if(hoverMq.matches&&ev.clientY<16)headerEl.classList.remove("away")},{passive:true});
// jump to top and to the end, each shown only when there is at least a screen to go
function updateJumpBtns(){
  const y=window.scrollY,rest=document.documentElement.scrollHeight-window.innerHeight-y;
  toTop.classList.toggle("show",y>500);toEnd.classList.toggle("show",rest>500);
}
window.addEventListener("scroll",()=>{
  slideHeader();
  if(!cjRaf){cjRaf=true;requestAnimationFrame(()=>{cjRaf=false;updateJumpBtns();updateCurrentJump()})}
},{passive:true});
toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
toEnd.addEventListener("click",()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}));

entryRadios.forEach(r=>r.checked=r.value===prefs.entries);
placeRadios.forEach(r=>{if(r.value!=="dex")r.disabled=prefs.entries==="col"});
setPlacement(prefs.placement);
setView(prefs.view);
</script>
